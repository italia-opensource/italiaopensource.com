# Consumer-owned workflow: sync the catalog from awesome-italia-opensource.
# Triggered manually, or by a repository_dispatch from the awesome repo's pipeline.
name: Sync Database

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - sync-database

jobs:
  sync-database:
    name: Sync Database
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Load env
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ref="main"
            branch="feat/sync-database-manual"
            body="Sync database: manually triggered by ${{ github.actor }}"
          else
            ref="${{ github.event.client_payload.hash }}"
            branch="feat/sync-database-${{ github.event.client_payload.hash }}"
            body="Sync database: triggered by [awesome-italia-opensource](https://github.com/italia-opensource/awesome-italia-opensource)"
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "body=${body}" >> "$GITHUB_OUTPUT"

      - name: Sync
        id: sync
        timeout-minutes: 5
        run: |
          ./scripts/sync-database.sh "${{ steps.env.outputs.ref }}"
          status="$(git status -s)"
          echo "## Status"; echo "${status}"
          if [ -z "${status}" ]; then
            echo "has_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only metadata.json changed on an awesome-triggered run → no meaningful diff.
          if [ "${{ github.event_name }}" == "repository_dispatch" ] && \
             [ "${status}" == " M src/content/data/metadata.json" ]; then
            echo "has_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changed=true" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: ${{ steps.sync.outputs.has_changed == 'true' }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.env.outputs.branch }}
          title: "feat(website): sync database"
          body: ${{ steps.env.outputs.body }}
          commit-message: "feat(website): sync database"
          add-paths: |
            src/content/data/*
